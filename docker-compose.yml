version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manuflow}
      POSTGRES_USER: ${POSTGRES_USER:-manuflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manuflow}
    volumes:
      - manuflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manuflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  notifications:
    build: ./notifications
    restart: unless-stopped
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      notifications:
        condition: service_started
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: ${POSTGRES_DB:-manuflow}
      POSTGRES_USER: ${POSTGRES_USER:-manuflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manuflow}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOW_ALL_ORIGINS: "True"
      NOTIFICATIONS_SERVICE_URL: http://notifications:4000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
        VITE_NOTIFICATIONS_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  manuflow_postgres_data:
