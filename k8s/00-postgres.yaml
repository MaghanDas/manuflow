apiVersion: v1
kind: Namespace
metadata:
  name: manuflow
---
apiVersion: v1
kind: Secret
metadata:
  name: manuflow-secrets
  namespace: manuflow
type: Opaque
stringData:
  POSTGRES_DB: manuflow
  POSTGRES_USER: manuflow
  POSTGRES_PASSWORD: manuflow
  DJANGO_SECRET_KEY: change-me-in-a-real-cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: manuflow
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: manuflow-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "manuflow"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: manuflow
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
