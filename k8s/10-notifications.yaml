apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: manuflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
        - name: notifications
          image: manuflow-notifications:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: manuflow
spec:
  selector:
    app: notifications
  ports:
    - port: 4000
      targetPort: 4000
