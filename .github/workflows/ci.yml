name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: manuflow
          POSTGRES_USER: manuflow
          POSTGRES_PASSWORD: manuflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manuflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-secret
          POSTGRES_DB: manuflow
          POSTGRES_USER: manuflow
          POSTGRES_PASSWORD: manuflow
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: python manage.py migrate --noinput

      - name: Run pytest
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-secret
          POSTGRES_DB: manuflow
          POSTGRES_USER: manuflow
          POSTGRES_PASSWORD: manuflow
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: pytest --cov=orders --cov-report=term-missing

  frontend-tests:
    name: Frontend (Jest + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Run Jest
        working-directory: frontend
        run: npx jest --ci

      - name: Build
        working-directory: frontend
        run: npm run build

  notifications-tests:
    name: Notifications (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: notifications/package-lock.json

      - name: Install dependencies
        working-directory: notifications
        run: npm ci

      - name: Run Jest
        working-directory: notifications
        run: npx jest --ci

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, notifications-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: manuflow-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: manuflow-frontend:${{ github.sha }}

      - name: Build notifications image
        uses: docker/build-push-action@v6
        with:
          context: ./notifications
          push: false
          tags: manuflow-notifications:${{ github.sha }}

  # Deploy is intentionally left as a template: wire in your registry
  # credentials and target (EC2 / Cloud Run / k8s) as repository secrets,
  # then uncomment and fill in the steps below.
  deploy:
    name: Deploy (template - disabled)
    runs-on: ubuntu-latest
    needs: [build-images]
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy placeholder
        run: echo "Wire up your AWS/GCP deployment here (see infra/README.md)"
